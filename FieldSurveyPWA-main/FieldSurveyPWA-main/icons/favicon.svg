<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.3"/>

  <!-- VKU V-Shape / Clipboard Graphic -->
  <g filter="url(#shadow)" transform="translate(256, 240)">
    <!-- Clipboard Board -->
    <rect x="-130" y="-120" width="260" height="320" rx="24" fill="#ffffff"/>
    
    <!-- Clipboard Clip Top -->
    <rect x="-60" y="-145" width="120" height="40" rx="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-125" r="8" fill="#ffffff"/>

    <!-- Survey List Lines -->
    <rect x="-90" y="-50" width="40" height="12" rx="6" fill="#3b82f6"/>
    <rect x="-35" y="-50" width="125" height="12" rx="6" fill="#cbd5e1"/>

    <rect x="-90" y="-10" width="40" height="12" rx="6" fill="#3b82f6"/>
    <rect x="-35" y="-10" width="125" height="12" rx="6" fill="#cbd5e1"/>

    <rect x="-90" y="30" width="40" height="12" rx="6" fill="#3b82f6"/>
    <rect x="-35" y="30" width="125" height="12" rx="6" fill="#cbd5e1"/>

    <!-- Green Checkmark Badge -->
    <circle cx="80" cy="110" r="46" fill="#10b981"/>
    <path d="M58 110 L74 126 L102 96" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- VKU Text Accent -->
  <text x="256" y="475" text-anchor="middle" fill="url(#goldGrad)" font-family="system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4">VKU FIELD SURVEY</text>
</svg>
